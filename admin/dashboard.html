<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Admin SIIU</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237C6EFF'/><text x='50%' y='68%' text-anchor='middle' font-size='18'>📋</text></svg>">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="content">
    <div class="page-header">
      <div class="d-flex align-items-center gap-3">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" title="Buka menu">&#9776;</button>
        <h4>Dashboard</h4>
      </div>
    </div>

    <div class="stats-row mb-4" id="statsCards"></div>

    <!-- Keuangan per Periode -->
    <div class="card mb-3">
      <div class="card-header">
        <span>Ringkasan Keuangan</span>
        <select class="form-select" style="width:auto;min-width:170px;font-size:12px;padding:6px 30px 6px 10px" id="financePeriodSelect" onchange="renderFinance()"></select>
      </div>
      <div class="card-body">
        <div class="stats-row mb-0" id="financeCards"></div>
      </div>
    </div>

    <!-- Recent Submissions -->
    <div class="card">
      <div class="card-header">
        <span>Submission Terbaru</span>
      </div>
      <div class="card-body p-0">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Guru</th>
                <th>Periode</th>
                <th>Total</th>
                <th>Status</th>
                <th>Tanggal</th>
              </tr>
            </thead>
            <tbody id="recentBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/db.js"></script>
<script>
function buildSidebar(active) {
  return '<div class="sidebar-header">' +
    '<div class="logo-icon">📋</div>' +
    '<div><div class="brand-name">Panel Admin</div><div class="brand-sub">SMP ABBS Surakarta</div></div>' +
    '</div>' +
    '<div class="sidebar-nav">' +
    navLink('dashboard.html', '📊', 'Dashboard', active === 'dashboard') +
    navLink('rekap.html',     '📋', 'Rekap Insentif', active === 'rekap') +
    navLink('komponen.html',  '⚙️', 'Komponen', active === 'komponen') +
    navLink('guru.html',      '👥', 'Guru', active === 'guru') +
    navLink('periode.html',   '📅', 'Periode', active === 'periode') +
    '<a class="nav-link logout" href="login.html" onclick="DB.logout()"><span class="nav-icon">🚪</span>Logout</a>' +
    '</div>';
}
function navLink(href, icon, label, isActive) {
  return '<a class="nav-link' + (isActive ? ' active' : '') + '" href="' + href + '">' +
    '<span class="nav-icon">' + icon + '</span>' + label + '</a>';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
}

(async function() {
  await DB.init();
  if (!DB.getSession()) { window.location.href = 'login.html'; return; }

  document.getElementById('sidebar').innerHTML = buildSidebar('dashboard');

  const teachers = DB.getAllTeachers().filter(t => t.isActive).length;
  const acts = DB.getActiveActivities().length;
  const subs = DB.getSubmissions();
  const totalInsentif = subs.reduce((s, sub) => s + sub.total, 0);
  const fmt = n => new Intl.NumberFormat('id-ID').format(n);

  document.getElementById('statsCards').innerHTML =
    statCard('stat-blue',   '👥', teachers,                  'Guru Aktif') +
    statCard('stat-purple', '📋', acts,                       'Komponen') +
    statCard('stat-green',  '📝', subs.length,               'Total Submission') +
    statCard('stat-yellow', '💰', 'Rp ' + fmt(totalInsentif),'Total Insentif');

  const fp = document.getElementById('financePeriodSelect');
  const periods = DB.getPeriods();
  if (periods.length === 0) {
    fp.innerHTML = '<option>Belum ada periode</option>';
  } else {
    periods.forEach(p => { fp.innerHTML += '<option value="' + p.id + '">' + p.name + '</option>'; });
    renderFinance();
  }

  const tbody = document.getElementById('recentBody');
  const recent = subs.slice(0, 10);
  if (recent.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-muted text-center py-4">Belum ada submission</td></tr>';
  } else {
    recent.forEach(s => {
      const pname = (periods.find(p => p.id === s.periodId) || {}).name || s.periodId;
      const d = new Date(s.submittedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      tbody.innerHTML +=
        '<tr>' +
        '<td><strong>' + s.teacherName + '</strong></td>' +
        '<td><span class="badge badge-null">' + pname + '</span></td>' +
        '<td class="text-success fw-bold">Rp ' + fmt(s.total) + '</td>' +
        '<td><span class="badge badge-approved">Terkirim</span></td>' +
        '<td class="text-muted">' + d + '</td>' +
        '</tr>';
    });
  }
})();

function statCard(cls, icon, val, label) {
  return '<div class="stat-card ' + cls + '">' +
    '<div class="stat-glow"></div>' +
    '<div class="stat-icon">' + icon + '</div>' +
    '<div class="number">' + val + '</div>' +
    '<div class="label">' + label + '</div>' +
    '</div>';
}

function renderFinance() {
  const pid = document.getElementById('financePeriodSelect').value;
  const f = DB.getPeriodFinance(pid);
  const fmt = n => 'Rp ' + new Intl.NumberFormat('id-ID').format(n);
  document.getElementById('financeCards').innerHTML =
    statCard('stat-green',  '💰', fmt(f.totalIncome),  'Dana Masuk') +
    statCard('stat-yellow', '📤', fmt(f.totalOutcome), 'Dana Keluar') +
    statCard(f.balance < 0 ? 'stat-red' : 'stat-blue',
      f.balance < 0 ? '⚠️' : '✅',
      fmt(f.balance),
      'Selisih');
}
</script>
</body>
</html>
